<!DOCTYPE html>
<html>
<head><title>Search Records</title></head>
<body>
    <h1>Search Patient Records</h1>
    <form method="POST">
        <input type="text" name="query" placeholder="Search by name...">
        <input type="submit" value="Search">
    </form>
    {% if results %}
        <table border="1">
            <tr>
                <th>Full Name</th>
                <th>Date of Birth</th>
                <th>Diagnosis</th>
                <th>Notes</th>
            </tr>
            {% for record in results %}
            <tr>
                <td>{{ record["full_name"] }}</td>
                <td>{{ record["date_of_birth"] }}</td>
                <td>{{ record["diagnosis"] }}</td>
                <td>{{ record["notes"] }}</td>
            </tr>
            {% endfor %}
    {% endif %}
    <p><a href="/dashboard">Back to Dashboard</a></p>
</body>
</html>
